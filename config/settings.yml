---
:ems:
  :ems_openshift:
    # High-frequency or routine lifecycle events filtered to reduce queue churn.
    :blacklisted_event_names:
    - CRONJOB_SCALINGREPLICASET
    - DAEMONSET_SCALINGREPLICASET
    - DEPLOYMENT_SCALINGREPLICASET
    - JOB_COMPLETED
    - JOB_SCALINGREPLICASET
    - NODE_NODEHASNODISKPRESSURE
    - NODE_NODEHASSUFFICIENTMEMORY
    - NODE_NODEHASSUFFICIENTPID
    - NODE_STARTING
    - PERSISTENTVOLUMECLAIM_PROVISIONINGSUCCEEDED
    - PERSISTENTVOLUMECLAIM_UNRECOGNIZEDDATASOURCEKIND
    - POD_ADDEDINTERFACE
    - POD_PULLED
    - POD_PULLING
    - POD_SUCCESSFULATTACHVOLUME
    - POD_SUCCESSFULDETACHVOLUME
    - POD_SUCCESSFULMOUNTVOLUME
    - POD_SUCCESSFULUNMOUNTVOLUME
    - REPLICASET_SCALINGREPLICASET
    - REPLICATOR_SCALINGREPLICASET
    - STATEFULSET_SCALINGREPLICASET
    
    :event_handling:
      :event_groups:
:hawkular_tenant_labels:
  :_hawkular_admin: Hawkular Admin
:http_proxy:
  :openshift:
    :host:
    :password:
    :port:
    :user:
:ems_refresh:
  :openshift:
    :refresh_interval: 15.minutes
    :streaming_refresh: true
    :chunk_size: 1_000
    :inventory_collections:
      :saver_strategy: batch
    :get_container_images: true
    :store_unused_images: true
  :openshift_infra:
    :refresh_interval: 0
:workers:
  :worker_base:
    :event_catcher:
      :event_catcher_openshift:
        :poll: 1.seconds
        :rails_worker: false
      :event_catcher_openshift_infra:
        :poll: 1.seconds
      :event_catcher_prometheus:
        :poll: 20.seconds
    :queue_worker_base:
        :ems_metrics_collector_worker:
          :ems_metrics_collector_worker_openshift: {}
          :ems_metrics_collector_worker_openshift_infra: {}
        :ems_refresh_worker:
          :ems_refresh_worker_openshift: {}
          :ems_refresh_worker_openshift_infra: {}
